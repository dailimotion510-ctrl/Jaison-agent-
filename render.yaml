services:
  - type: web
    name: jaison-telegram-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CRISTIAN_USER_ID
        sync: false
      - key: STICKERS_JSON
        sync: false
